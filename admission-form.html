<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Admission Form</title>
    <style>
        form {
            padding: 2vw;
        }

        .form-control:focus {
            color: #495057;
            background-color: #fff;
            border-color: #A7016B;
            outline: 0;
            box-shadow: 0 0 0 .2rem #ed51b4b8
        }

        .btn-primary {
            color: #fff;
            background-color: #A7016B;
            border-color: #A7016B
        }

        .btn-primary:hover {
            color: #fff;
            background-color: #A7016B;
            border-color: #A7016B
        }

        .btn-primary:not(:disabled):not(.disabled).active,
        .btn-primary:not(:disabled):not(.disabled):active,
        .show>.btn-primary.dropdown-toggle {
            color: #fff;
            background-color: #A7016B;
            border-color: #A7016B
        }

        .btn-primary:not(:disabled):not(.disabled).active:focus,
        .btn-primary:not(:disabled):not(.disabled):active:focus,
        .show>.btn-primary.dropdown-toggle:focus {
            box-shadow: 0 0 0 .2rem #A7016B;
        }

        .form-check-label,
        .form-check-input[disabled]~.form-check-label {
            color: black
        } 
        button{
            background-color: #A7016B;
            font-size: 1.1rem;
            color: white;
            padding: 5px;
            border-radius: 2px;
        }    
    </style>
</head>

<body>
    <div class="container mt-5">
        <a href="admissions.html"><button class="left-arrow-btn">
            &#x2190; Back
          </button>
          </a>
        <h2 class="text-center">Admission Form</h2>

        <form>
            <h4 class="mt-4">1. Student Details (विद्यार्थी माहिती)</h4>
            <div class="form-row">
                <div class="form-group col-md-4">
                    <label for="firstName">First Name(नाव)</label>
                    <input type="text" class="form-control" id="firstName" required>
                </div>
                <div class="form-group col-md-4">
                    <label for="middleName">Middle Name(वडिलांचे नाव)</label>
                    <input type="text" class="form-control" id="middleName">
                </div>
                <div class="form-group col-md-4">
                    <label for="lastName">आडनाव</label>
                    <input type="text" class="form-control" id="lastName" required>
                </div>
            </div>
            <div class="form-group">
                <label>Gender(लिंग)</label>
                <div class="form-row">
                    <div class="form-check col-md-4">
                        <input class="form-check-input" type="radio" name="gender" id="male" value="male" required>
                        <label class="form-check-label" for="male">Male(पुरुष)</label>
                    </div>
                    <div class="form-check col-md-4">
                        <input class="form-check-input" type="radio" name="gender" id="female" value="female" required>
                        <label class="form-check-label" for="female">Female(स्त्री)</label>
                    </div>
                    <div class="form-check col-md-4">
                        <input class="form-check-input" type="radio" name="gender" id="other" value="other">
                        <label class="form-check-label" for="other">Other(इतर)</label>
                    </div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="dob">Date of Birth(जन्मतारीख)</label>
                    <input type="date" class="form-control" id="dob" required>
                </div>
                <div class="form-group col-md-6">
                    <label for="birthPlace">Birth Place(जन्म ठिकाण)</label>
                    <input type="text" class="form-control" id="birthPlace" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group col-md-4">
                    <label for="motherTongue">Mother Tongue(मातृभाषा)</label>
                    <input type="text" class="form-control" id="motherTongue" required>
                </div>
                <div class="form-group col-md-4">
                    <label for="casteCategory">Caste Category(कास्ट श्रेणी)</label>
                    <input type="text" class="form-control" id="casteCategory" required>
                </div>
                <div class="form-group col-md-4">
                    <label for="bloodGroup">Blood Group (रक्त गट)</label>
                    <select class="form-control" id="bloodGroup" required>
                        <option value="" disabled selected>Select Blood Group(रक्त गट निवडा)</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="email">Email Address(ईमेल) (Optional)</label>
                    <input type="email" class="form-control" id="email">
                </div>
                <div class="form-group col-md-6">
                    <label for="phone">Phone Number(फोन नंबर)</label>
                    <input type="tel" class="form-control" id="phone" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="currentAddress">Current Address(वर्तमान पत्ता)</label>
                    <textarea class="form-control" id="currentAddress" rows="3" required></textarea>
                </div>
                <div class="form-group col-md-6">
                    <label for="permanentAddress">Permanent Address(कायम पत्ता)</label>
                    <textarea class="form-control" id="permanentAddress" rows="3" required></textarea>
                </div>
            </div>
            <div class="form-group">
                <label for="classForAdmission">Class for Admission(प्रवेशासाठी वर्ग)</label>
                <select class="form-control" id="classForAdmission" required>
                    <option value="" disabled selected>Select Class(वर्ग निवडा)</option>
                    <option value="1">1st</option>
                    <option value="2">2nd</option>
                    <option value="3">3rd</option>
                    <option value="4">4th</option>
                    <option value="5">5th</option>
                    <option value="6">6th</option>
                    <option value="7">7th</option>
                    <option value="8">8th</option>
                    <option value="9">9th</option>
                    <option value="10">10th</option>
                </select>
            </div>

            <h4 class="mt-4">2. Educational Details(शैक्षणिक तपशील)</h4>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="previousSchool">Previous School(मागील शाळा)</label>
                    <input type="text" class="form-control" id="previousSchool" required>
                </div>
                <div class="form-group col-md-6">
                    <label for="lastClass">Last Class Completed(शेवटचा वर्ग)</label>
                    <input type="text" class="form-control" id="lastClass" required>
                </div>

            </div>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="percentage">Percentage Obtained(टक्केवारी मिळवली)</label>
                    <input type="number" class="form-control" id="percentage" required>
                </div>
                <div class="form-group col-md-6">
                    <label for="yearOfPassing">Year of Passing(उत्तीर्ण होण्याचे वर्ष)</label>
                    <input type="number" class="form-control" id="yearOfPassing" required>
                </div>
            </div>

            <h4 class="mt-4">3. Parents Details(पालक तपशील)</h4>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="fatherName">Father's Name(वडिलांचे नाव)</label>
                    <input type="text" class="form-control" id="fatherName" required>
                </div>
                <div class="form-group col-md-6">
                    <label for="motherName">Mother's Name(आईचे नाव)</label>
                    <input type="text" class="form-control" id="motherName" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="fatherOccupation">Father's Occupation(वडिलांचे व्यवसाय)</label>
                    <input type="text" class="form-control" id="fatherOccupation" required>
                </div>
                <div class="form-group col-md-6">
                    <label for="motherOccupation">Mother's Occupation(आईचे व्यवसाय)</label>
                    <input type="text" class="form-control" id="motherOccupation" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="fatherPhone">Father's Phone Number(वडिलांचे फोन नंबर)</label>
                    <input type="tel" class="form-control" id="fatherPhone" required>
                </div>
                <div class="form-group col-md-6">
                    <label for="motherPhone">Mother's Phone Number(आईचे फोन नंबर)</label>
                    <input type="tel" class="form-control" id="motherPhone" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
</body>

</html>
